<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 36" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }
      @keyframes blinkLed {
        0%, 100% { fill: #FFE600; }
        50% { fill: #1E293B; }
      }
      .led {
        animation: blinkLed 2s infinite steps(1);
      }
    </style>
  </defs>

  <rect width="850" height="36" fill="#0A0E17"/>

  <!-- Top Window Bar Container -->
  <rect x="6" y="4" width="838" height="30" fill="#1C1805" stroke="#162235" stroke-width="2"/>
  <rect x="8" y="6" width="834" height="26" fill="none" stroke="#FFE600" stroke-width="1.5" opacity="0.8"/>

  <!-- Corner notches -->
  <rect x="6" y="4" width="4" height="4" fill="#FFE600"/>
  <rect x="840" y="4" width="4" height="4" fill="#FFE600"/>
  <rect x="6" y="30" width="4" height="4" fill="#FFE600"/>
  <rect x="840" y="30" width="4" height="4" fill="#FFE600"/>

  <!-- Status LED -->
  <circle cx="24" cy="19" r="4" fill="#FFE600" class="led"/>

  <!-- Title Text -->
  <text x="36" y="23" fill="#FFE600" font-size="12" font-weight="bold" letter-spacing="1" class="font-mono">
    ╔═ LAB_04 // SOLAR_NEIGHBORHOOD_500LY_MESH.EXE
  </text>

  <!-- Tag on right -->
  <rect x="670" y="10" width="115" height="18" fill="#0A0E17" stroke="#FFE600" stroke-width="1"/>
  <text x="727" y="23" fill="#FFE600" font-size="9" font-weight="bold" text-anchor="middle" class="font-mono">[500LY_SQLITE]</text>

  <!-- Window controls [ _ ] [ □ ] [ × ] -->
  <rect x="793" y="12" width="14" height="14" fill="#162235"/>
  <text x="797" y="22" fill="#8892B0" font-size="10" font-weight="bold" class="font-mono">_</text>

  <rect x="811" y="12" width="14" height="14" fill="#162235"/>
  <text x="814" y="23" fill="#8892B0" font-size="10" font-weight="bold" class="font-mono">□</text>

  <rect x="829" y="12" width="14" height="14" fill="#FF0055"/>
  <text x="833" y="23" fill="#FFFFFF" font-size="10" font-weight="bold" class="font-mono">×</text>
</svg>